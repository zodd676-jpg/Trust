</style></head><body><div id="v"></div><div id="nav"></div><div id="sh"></div><div id="tt"></div>
<script>

function sp(k,up,w,h){var r=7,p=[],y=.5,i;for(i=0;i<k.length;i++)r=(r*31+k.charCodeAt(i))>>>0;for(i=0;i<24;i++){r=(r*1664525+1013904223)>>>0;y+=r/4294967296*.3-.15+(up?.025:-.025);y=Math.max(.05,Math.min(.95,y));p.push((i*w/23).toFixed(1)+','+((1-y)*h).toFixed(1))}return `<svg width=${w} height=${h}><polyline fill=none stroke="${up?'#2e9e4f':'#c0392b'}" stroke-width=1.6 points="${p.join(' ')}"/></svg>`}
